name: PHPUnit diagnosis (ephemeral)

on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  diagnose:
    name: PHPUnit verbose diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit verbose
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --debug --verbose --stop-on-failure > phpunit.log 2>&1
          EXITCODE=$?
          echo "EXIT=$EXITCODE"
          echo "PHPUnit exit: $EXITCODE"
          # Show the tail directly in step log (first 60 lines and last 200)
          echo "----- HEAD -----"
          head -n 80 phpunit.log
          echo "----- TAIL -----"
          tail -n 200 phpunit.log
          exit $EXITCODE
      - name: Upload phpunit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-log
          path: backend/phpunit.log
          if-no-files-found: error
