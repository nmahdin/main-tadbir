name: PHPUnit diagnosis (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit Unit tests
        id: u
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --testsuite Unit > unit.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Unit output
        if: always()
        working-directory: backend
        run: |
          echo "Unit EC=${{ steps.u.outputs.ec }}"
          echo "---tail---"
          tail -40 unit.out
      - name: PHPUnit Feature tests
        id: f
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --testsuite Feature > feat.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Feature output
        if: always()
        working-directory: backend
        run: |
          echo "Feature EC=${{ steps.f.outputs.ec }}"
          echo "---tail 60 feat.out---"
          tail -60 feat.out
      - name: Fail
        if: always()
        run: |
          EC="${{ steps.u.outputs.ec }}"
          EF="${{ steps.f.outputs.ec }}"
          echo "EC=$EC EF=$EF"
          [ "${{ steps.u.outputs.ec }}" != "0" ] && exit ${{ steps.u.outputs.ec }}
          [ "${{ steps.f.outputs.ec }}" != "0" ] && exit ${{ steps.f.outputs.ec }}
          exit 0
