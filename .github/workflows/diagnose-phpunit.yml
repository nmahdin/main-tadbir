name: PHPUnit diagnosis (ephemeral)

on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  diagnose:
    name: PHPUnit verbose diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit first failure
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          # --filter nonexistent to test if it's bootstrap or a specific test; first run --stop-on-failure
          php vendor/bin/phpunit --colors=never --stop-on-failure 2>&1 | tee /tmp/p.out
          EXIT=${PIPESTATUS[0]}
          echo "EXIT=$EXIT"
          # Print the last 80 lines to step log; these appear in check-run annotations? Actually we can emit error annotations per line using ::error:: but they'll be visible via the annotations API.
          python3 - <<'PY'
          import os, re
          log=open('/tmp/p.out',encoding='utf-8',errors='replace').read().splitlines()
          # emit first 30 lines + lines around FAILURE/Error/Exception/FAILED as ::error::file=::line::col::message
          for line in log:
              # GitHub Actions annotation supports up to ~1024 but we only emit 40 annotations to be safe
              if re.search(r'(FAILED|FAILURES|Error|Exception|Fatal error|TypeError|ParseError|not found|Class .* not found|failed asserting|Failed asserting)', line):
                  safe = line.replace('%','%25').replace('\r','').replace('\n','')[:400]
                  print(f'::error::{safe}')
          PY
          exit $EXIT
