name: PHPUnit diagnosis (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit to file
        id: pu
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --debug > ${{ github.workspace }}/phpunit.log 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Commit phpunit log
        if: always()
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp phpunit.log .phpunit-log.txt
          git add .phpunit-log.txt
          git diff --cached --quiet || git commit -m "chore(diag): capture phpunit.log"
          git push origin HEAD:${{ github.head_ref || github.ref_name }} 2>&1 | tail -5 || echo "push failed"
      - name: Fail
        if: always()
        run: |
          EC="${{ steps.pu.outputs.ec }}"
          [ -n "$EC" ] && exit "$EC" || exit 0
