name: PHPUnit diagnosis (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --verbose 2>&1 | tee /tmp/p.out
          EXIT=${PIPESTATUS[0]}
          echo "::group::PHPUnit tail"
          tail -n 120 /tmp/p.out
          echo "::endgroup::"
          # Emit the last 25 failure lines as error annotations too
          python3 - <<'PY'
          import re
          log=open('/tmp/p.out',encoding='utf-8',errors='replace').read().splitlines()
          # Find all FAILURES and emit lines in context
          out=[]
          for i,line in enumerate(log):
              if re.search(r'(FAILURES|Failed asserting|Error|Exception|TypeError|FAILED:|^[0-9]+\))', line):
                  for j in range(max(0,i-2), min(len(log),i+8)):
                      out.append(log[j])
          for line in out[-40:]:
              safe = line.replace('%','%25').replace('\r','')[:800]
              print(f'::error::{safe}')
          PY
          exit $EXIT
