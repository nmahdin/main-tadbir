name: PHPUnit diagnosis (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit to file
        id: pu
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never > $GITHUB_WORKSPACE/p.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Post failures as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('${{ github.workspace }}/p.out', 'utf8');
            const lines = content.split('\n');
            let out = [];
            let inFail = false;
            let failStart = -1;
            for (let i = 0; i < lines.length; i++) {
              if (/^(FAILURES!|ERRORS!|There (was|were) \d+ (error|failure)|^[0-9]+\))/.test(lines[i])) {
                inFail = true; failStart = Math.max(0, i-5);
              }
              if (inFail) {
                if (i - failStart > 80) inFail = false;
                else out.push(lines[i]);
              }
            }
            out.push('--- TAIL ---');
            out = out.concat(lines.slice(-40));
            const body = '## PHPUnit failures/tail (ec=${{ steps.pu.outputs.ec }})\n\n```\n' + out.join('\n').slice(-30000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
      - name: Fail
        if: always()
        run: |
          EC="${{ steps.pu.outputs.ec }}"
          [ -n "$EC" ] && exit "$EC" || exit 0
