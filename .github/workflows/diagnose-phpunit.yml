name: PHPUnit diagnosis (ephemeral)

on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:

jobs:
  diagnose:
    name: PHPUnit verbose diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit verbose
        id: phpunit
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --debug --verbose --stop-on-failure > phpunit.log 2>&1
          EXITCODE=$?
          echo "exit_code=$EXITCODE" >> "$GITHUB_OUTPUT"
          # Put the whole log into an output variable (base64 to keep newlines).
          {
            echo "log<<EOF"
            cat phpunit.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "PHPUnit exit: $EXITCODE"
          exit $EXITCODE
      - name: Annotate log into summary
        if: always()
        run: |
          {
            echo "### PHPUnit exit code: ${{ steps.phpunit.outputs.exit_code }}"
            echo
            echo '```'
            echo "${{ steps.phpunit.outputs.log }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
