name: pint fix (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip, opcache
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint fix
        working-directory: backend
        run: php vendor/bin/pint app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
      - name: Commit & push
        run: |
          git config user.name "arena-agent"
          git config user.email "arena@example.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(c5-m2-s3): pint"
            git push
          fi
      - name: Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'pint fixed and pushed (if any)'});
