name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, tests and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit and regression tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'false'
          VITE_API_URL: https://api-tadbir.morvarid-daron.ir/api/v1
          VITE_SANCTUM_URL: https://api-tadbir.morvarid-daron.ir
        run: npm run build
      - name: Record artifact identity
        run: |
          printf 'commit=%s\nrun=%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > frontend/dist/release-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tadbir-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: Backend contracts and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2
      - name: Validate Composer contract
        working-directory: backend
        run: composer validate --no-check-publish --strict
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint check (Stage 02 architecture zones only)
        working-directory: backend
        # Scoped deliberately: legacy zones are formatted when their module
        # migrates (CODING_STANDARDS ratchet), never mass-reformatted.
        run: php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
      - name: Migration gate on a clean database
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          timeout 600 php vendor/bin/phpunit --colors=never --log-teamcity /tmp/tc.txt tests/Feature/Core/PlanChangeTest.php tests/Feature/Core/PlatformSubscriptionApiTest.php > /tmp/phpunit.txt 2>&1 || true
          grep -aE "testFailed|testError" /tmp/tc.txt | head -30 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          grep -a "testStarted" /tmp/tc.txt | tail -6 | while IFS= read -r line; do echo "::error::STARTED ${line:0:400}"; done
          tail -c 2000 /tmp/phpunit.txt | while IFS= read -r line; do echo "::error::TAIL ${line:0:900}"; done
          exit 1

  backend-mysql:
    name: Backend migration gate on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tadbir_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migration gate on a clean MySQL database
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tadbir_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force --no-interaction
      - name: MySQL concurrency tests (Stage 03B scoped RBAC + C1-H1 identity)
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tadbir_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php vendor/bin/phpunit --colors=never tests/Feature/Core/CoreRbacConcurrencyMysqlTest.php tests/Feature/Core/CoreIdentityConcurrencyMysqlTest.php tests/Feature/Core/PlatformSchemaMysqlTest.php tests/Feature/Core/PlatformConcurrencyMysqlTest.php tests/Feature/Core/PlatformOperationsConcurrencyMysqlTest.php tests/Feature/Core/PlatformInvariantsConcurrencyMysqlTest.php tests/Feature/Core/OrganizationLifecycleConcurrencyMysqlTest.php tests/Feature/Core/OrganizationJobSafetyConcurrencyMysqlTest.php tests/Feature/Core/ModuleSchemaMysqlTest.php tests/Feature/Core/ModuleActivationConcurrencyMysqlTest.php tests/Feature/Core/PlanSchemaMysqlTest.php tests/Feature/Core/SubscriptionConcurrencyMysqlTest.php tests/Feature/Core/EntitlementConcurrencyMysqlTest.php tests/Feature/Core/PlanChangeConcurrencyMysqlTest.php


