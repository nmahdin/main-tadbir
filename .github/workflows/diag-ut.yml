name: PHPUnit errors only (ephemeral)
on:
  pull_request:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip, opcache
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHPUnit errors only
        id: ut
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never > ut.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Post
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('backend/ut.out','utf8');
            // Print summary and error sections only
            const lines = out.split('\n');
            const errLines = [];
            let capture = false;
            for (const l of lines) {
              if (/^There (was|were)/.test(l) || /^ERRORS!/.test(l) || /^FAILURES!/.test(l)) { errLines.push(l); capture=true; continue; }
              if (/^E /.test(l) || /^\d+\) /.test(l)) { errLines.push(l); capture=true; continue; }
              if (capture && l.trim().length > 0) { errLines.push(l); }
              if (capture && /^$/.test(l) && errLines.length > 0 && errLines[errLines.length-1] !== '') { errLines.push(l); }
            }
            const body = '## PHPUnit errors\n\n```\n' + errLines.slice(-300).join('\n').slice(-30000) + '\n\n---full tail---\n' + out.slice(-8000) + '\n```';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Fail
        if: always()
        run: exit ${{ steps.ut.outputs.ec }}
