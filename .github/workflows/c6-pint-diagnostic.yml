name: C6 Pint diagnostic (temporary)
on:
  push:
    branches:
      - 'arena/582a70e5-main-tadbir'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: backend
      - name: Generate diagnostic-only formatted patch
        working-directory: backend
        run: |
          php vendor/bin/pint app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
          git diff --binary -- app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > ../c6-pint.patch
          git diff --name-only -- app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > ../c6-pint-files.txt
          cat ../c6-pint-files.txt
          test -s ../c6-pint.patch
      - uses: actions/upload-artifact@v4
        with:
          name: c6-pint-format-patch
          path: |
            c6-pint.patch
            c6-pint-files.txt
          if-no-files-found: error
