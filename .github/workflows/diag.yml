name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test -v app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php 2>&1 > /tmp/pint.txt
          rc=${PIPESTATUS[0]}
          cat /tmp/pint.txt
          python3 <<'PY'
import re
with open('/tmp/pint.txt') as f:
    for line in f:
        # match like "app/Core/X.php:line" in verbose mode
        m = re.search(r'([\w/]+\.php):(\d+).*?(\w+(?:_\w+)+)', line)
        if m:
            fn, ln, rule = m.groups()
            print(f'::error file={fn},line={ln}::{rule}')
PY
          exit $rc
