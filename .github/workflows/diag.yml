name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php app/Providers routes 2>&1 | tee /tmp/pint.txt
          echo ${PIPESTATUS[0]} > /tmp/prc.txt
      - name: pint ann
        if: always()
        run: tail -20 /tmp/pint.txt
      - name: Migrate
        if: always()
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit
        if: always()
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --log-junit /tmp/junit.xml
          echo $? > /tmp/rc.txt
      - name: php ann
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          try:
              tree=ET.parse('/tmp/junit.xml'); root=tree.getroot(); failures=[]
              for ts in root.iter('testsuite'):
                  for tc in ts.findall('testcase'):
                      for f in tc.findall('failure')+tc.findall('error'):
                          failures.append((tc.attrib.get('classname',''), tc.attrib.get('name',''), f.text or ''))
              for cname,name,txt in failures[:20]:
                  short=txt.strip().replace('\n','%0A')[:900]
                  print(f'::error file=test::{cname}::{name} - {short}')
              print(f'TOTAL_FAILURES={len(failures)}')
          except FileNotFoundError:
              print('::error::No junit.xml')
          PY
      - name: exit
        if: always()
        run: |
          P=$(cat /tmp/prc.txt 2>/dev/null || echo 0); U=$(cat /tmp/rc.txt 2>/dev/null || echo 0); [ "$P" != "0" ] && exit $P; exit $U
