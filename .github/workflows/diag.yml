name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: |
          set +e
          out=$(php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php 2>&1)
          rc=$?
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          python3 <<PY
import os
out = """$out"""
lines = out.split('\n')
for line in lines:
    if '⨯' in line or ('FAIL' in line and 'at' in line):
        fn = 'pint'
        parts = line.split('⨯')
        if len(parts) >= 2:
            path = parts[1].strip().split()[0]
            print(f'::error file={path}::{line.strip()[:350]}')
        else:
            print(f'::error file=pint::{line.strip()[:350]}')
PY
          exit $rc
