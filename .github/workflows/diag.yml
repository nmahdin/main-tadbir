name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: php vendor/bin/pint app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
      - name: commit
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "style(pint): automated fixes"
          git push
