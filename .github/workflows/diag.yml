name: diag-full
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate first (sqlite file)
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan migrate:fresh --force --no-interaction -v
      - name: PHPUnit
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php vendor/bin/phpunit --colors=never --stop-on-failure 2>&1 | tail -80
