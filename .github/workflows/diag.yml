name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test --format=checkstyle app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > /tmp/pint.xml 2>&1
          rc=$?
          python3 <<'PY'
import xml.etree.ElementTree as ET
try:
    tree = ET.parse('/tmp/pint.xml')
    root = tree.getroot()
    for f in root:
        fn = f.attrib.get('name','')
        for err in f:
            line = err.attrib.get('line','1')
            col = err.attrib.get('column','1')
            src = err.attrib.get('source','')
            sev = err.attrib.get('severity','error')
            msg = err.attrib.get('message','')
            print(f'::{sev} file={fn},line={line},col={col},title={src}::{msg}')
except Exception as e:
    print('PARSE_ERR', e)
    with open('/tmp/pint.xml') as fh:
        print(fh.read()[:1000])
PY
          exit $rc
