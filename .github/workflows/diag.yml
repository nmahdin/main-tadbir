name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer validate --no-check-publish --strict
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: apply
        working-directory: backend
        run: php vendor/bin/pint app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
      - name: diff
        run: git diff --stat; git diff > /tmp/diff.txt; wc -l /tmp/diff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diff
          path: /tmp/diff.txt
          retention-days: 1
