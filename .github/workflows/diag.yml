name: diag-pint7
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer contract
        working-directory: backend
        run: composer validate --no-check-publish --strict
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        working-directory: backend
        run: |
          echo "PWD=$(pwd)"
          echo "===RUN PINT==="
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
          rc=$?
          echo "pint exit=$rc"
          exit 0
