name: diag-comment
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit and write output to a file in workspace
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never > /tmp/phpunit.txt 2>&1
          echo "exit=$?" >> /tmp/phpunit.txt
          # Also write to a github env file so we can upload it as artifact
          cp /tmp/phpunit.txt ../phpunit-result.txt
          tail -80 ../phpunit-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phpunit-result
          path: phpunit-result.txt
