name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer validate --no-check-publish --strict
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php 2>&1 | tee /tmp/pint.txt
          rc=${PIPESTATUS[0]}
          # Emit each line that contains ⨯ as error annotation
          python3 <<'PY'
          with open('/tmp/pint.txt') as f:
              lines = f.read().split('\n')
          for i, line in enumerate(lines):
              if '⨯' in line or 'FAIL' in line:
                  msg = line.strip().replace(',','%2C').replace('\n','%0A')
                  print(f'::error file=pint,line={i+1}::{msg}')
          # Also show summary
          for l in lines[-15:]:
              print(l)
          PY
          exit $rc
