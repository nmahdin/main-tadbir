name: diag
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pintdiff
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test --format=json app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > /tmp/pint.json 2>&1
          rc=$?
          python3 <<'PY'
import json
with open('/tmp/pint.json') as f:
    txt = f.read()
# find JSON in output
try:
    data = json.loads(txt)
except:
    # strip prefix
    start = txt.find('{')
    data = json.loads(txt[start:])
for f in data.get('files',[]):
    fn = f.get('file','')
    for v in f.get('violations',[]):
        line = v.get('line',0)
        msg = v.get('message','')
        src = v.get('source','')
        print(f'::error file={fn},line={line}::{msg} ({src})')
print(f"TOTAL {len(data.get('files',[]))} files, errors in {sum(1 for f in data.get('files',[]) if f.get('violations'))}")
PY
          exit $rc
