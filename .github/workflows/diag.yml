name: diag-pint3
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,xml,curl,zip,pdo_mysql,intl,bcmath
          tools: composer
      - working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: pint --test (exact quality command)
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php 2>&1 | tee /tmp/pint.out
          rc=$?
          echo "--- FILE LIST WITH ISSUES ---"
          # Show files pint marked FAILED
          grep -E "(FAIL|!|\\.php$)" /tmp/pint.out | tail -60
          exit $rc
