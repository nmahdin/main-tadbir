name: diag-pint2
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/diag.yml']
  push:
    branches: [arena/582a70e5-main-tadbir]
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,xml,curl,zip,pdo_mysql,intl,bcmath
          tools: composer
      - working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: pint (full quality command)
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > /tmp/pint.out 2>&1
          echo "exit=$?"
          tail -100 /tmp/pint.out
