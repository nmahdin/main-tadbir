name: diag-pint-art
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint capture
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint -v --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php app/Providers routes 2>&1 | tee pint.txt
          echo ${PIPESTATUS[0]} > rc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pint-log
          path: backend/pint.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pint-rc
          path: backend/rc.txt
      - name: show
        if: always()
        run: tail -80 backend/pint.txt; echo "---"; cat backend/rc.txt
