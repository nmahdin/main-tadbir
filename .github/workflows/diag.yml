name: diag-junit2
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    name: Backend contracts and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Install deps
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        working-directory: backend
        run: php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php
      - name: Migrate
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan migrate:fresh --force --no-interaction
      - name: PHPUnit with JUnit
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never --log-junit /tmp/junit.xml
          echo $? > /tmp/rc.txt
      - name: Surface failures as annotations
        if: always()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('/tmp/junit.xml')
              root = tree.getroot()
              failures = []
              for ts in root.iter('testsuite'):
                  for tc in ts.findall('testcase'):
                      for f in tc.findall('failure') + tc.findall('error'):
                          failures.append((tc.attrib.get('classname',''), tc.attrib.get('name',''), f.text or ''))
              for cname,name,txt in failures[:30]:
                  short = txt.strip().replace('\n','%0A')[:900]
                  print(f'::error file=test::{cname}::{name} - {short}')
              print(f'TOTAL_FAILURES={len(failures)}')
          except FileNotFoundError:
              print('::error::No junit.xml produced')
          PY
          echo "--- rc: $(cat /tmp/rc.txt 2>/dev/null)"
      - name: Exit with phpunit rc
        if: always()
        run: exit $(cat /tmp/rc.txt 2>/dev/null || echo 1)
