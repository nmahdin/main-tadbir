name: diag-pint-tail
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: pint capture
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php app/Providers routes > /tmp/pint.txt 2>&1
          echo $? > /tmp/rc.txt
      - name: tail
        if: always()
        run: |
          cat /tmp/pint.txt
          echo "===rc==="
          cat /tmp/rc.txt
      - name: exit rc
        if: always()
        run: exit $(cat /tmp/rc.txt)
