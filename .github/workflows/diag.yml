name: diag-last
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHPUnit tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php vendor/bin/phpunit --colors=never --stop-on-failure tests/Feature/Core/ 2>&1 | tee out.txt
          echo "===DONE==="
      - name: echo output
        if: failure()
        run: |
          cat backend/out.txt
