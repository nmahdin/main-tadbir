name: diag-pint6
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer contract
        working-directory: backend
        run: composer validate --no-check-publish --strict
      - name: Install locked dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run Pint (fail-tolerant)
        working-directory: backend
        run: |
          echo "PWD=$(pwd)"
          ls vendor/bin/pint
          echo "===RUN==="
          php vendor/bin/pint --test -v app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > pintout.txt 2>&1
          rc=$?
          echo "exit=$rc"
          echo "===PINTOUT LENGTH==="
          wc -l pintout.txt
          echo "===PINTOUT==="
          cat pintout.txt
          echo "===END==="
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pintout
          path: backend/pintout.txt
