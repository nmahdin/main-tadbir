name: diag (ephemeral)
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip, opcache
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        id: pint
        working-directory: backend
        run: |
          set +e
          php vendor/bin/pint --test app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php > pint.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: PHPUnit
        id: ut
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set +e
          php vendor/bin/phpunit --colors=never > ut.out 2>&1
          echo "ec=$?" >> $GITHUB_OUTPUT
      - name: Post
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let p='',u='';
            try{p=fs.readFileSync('backend/pint.out','utf8')}catch(e){p='no pint'}
            try{u=fs.readFileSync('backend/ut.out','utf8')}catch(e){u='no ut'}
            const tail=u.slice(-3000);
            const lines=u.split('\n');
            const idxs=[];
            for(let i=0;i<lines.length;i++){if(/^\d+\)/.test(lines[i]))idxs.push(i)}
            let first='';
            if(idxs.length>0){first=lines.slice(Math.max(0,idxs[0]-5),idxs[0]+40).join('\n')}
            const body='## pint\n```\n'+p.slice(-5000)+'\n```\n\n## first errors\n```\n'+first.slice(0,12000)+'\n```\n\n## tail\n```\n'+tail+'\n```';
            const {data: comments} = await github.rest.issues.listComments({owner:context.repo.owner,repo:context.repo.repo,issue_number:14});
            const me=comments.find(c=>c.user.type==='Bot' && c.body.startsWith('## pint'));
            if(me){await github.rest.issues.deleteComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:me.id})}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:14,body});
