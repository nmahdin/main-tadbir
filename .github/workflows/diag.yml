name: diag-pint
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/diag.yml']
  push:
    branches: [arena/582a70e5-main-tadbir]
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,xml,curl,zip,pdo_mysql,intl,bcmath
          tools: composer
      - working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: pint diff on S4 files
        working-directory: backend
        run: |
          php vendor/bin/pint -v app/Core/Billing/OrderService.php app/Core/Billing/CoreBillingOrder.php app/Core/Billing/CoreBillingOrderLine.php app/Core/Billing/CorePromoReservation.php app/Core/Billing/QuoteService.php app/Http/Controllers/Api/V1/BillingOrderController.php app/Console/Commands/ExpireBillingOrders.php tests/Feature/Core/BillingOrderTest.php routes/console.php routes/api.php
          echo "---DIFF---"
          cd .. && git diff backend/app backend/routes backend/tests | head -500
