name: diag-pint4
on:
  push:
    branches: [arena/582a70e5-main-tadbir]
  workflow_dispatch:
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,xml,curl,zip,pdo_mysql,intl,bcmath
          tools: composer
      - working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint (exact quality config)
        working-directory: backend
        run: php vendor/bin/pint --test -v app/Core app/Modules tests/Unit/Architecture bootstrap/providers.php 2>&1 | tail -200
