<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the last selected palette before CSS/React can paint.
      try {
        const color = localStorage.getItem('tadbir:theme-color');
        if (/^#[0-9a-f]{6}$/i.test(color || '')) {
          document.documentElement.style.setProperty('--color-primary', color);
          document.documentElement.style.setProperty('--color-primary-hover', `color-mix(in srgb, ${color} 85%, black)`);
        }
        // رنگ دوم هم پیش از رنگ‌آمیزی اولیه اعمال می‌شود تا پرش رنگ دیده نشود.
        const secondary = localStorage.getItem('tadbir:theme-secondary');
        if (/^#[0-9a-f]{6}$/i.test(secondary || '')) {
          document.documentElement.style.setProperty('--brand-secondary', secondary);
          document.documentElement.style.setProperty('--color-secondary', secondary);
        }
      } catch (_) { /* storage can be disabled by the browser */ }
    </script>
    <!-- آیکون پیش‌فرض؛ مرورگر فقط یک آیکون را جدی می‌گیرد، پس آیکون
         سفارشیِ سامانه همین لینک را جایگزین می‌کند (see src/utils/favicon.ts). -->
    <!-- A neutral placeholder avoids briefly displaying the wrong organization's icon.
         The last verified custom icon is restored synchronously before React starts. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" data-tadbir-favicon="pending" />
    <script>
      try {
        const saved = localStorage.getItem('tadbir:brand-favicon');
        if (saved) {
          const url = new URL(saved, location.href);
          if ((url.protocol === 'https:' || url.protocol === 'http:') && !url.username && !url.password) {
            const icon = document.querySelector('link[rel="icon"]');
            // نوعِ اعلام‌شده باید با فایل هم‌خوان باشد؛ اگر `type="image/svg+xml"`
            // روی یک PNG بماند، مرورگر آیکون را رد می‌کند و همان آیکون قبلیِ تب
            // دیده می‌شود. پس نوع حذف می‌شود و تصمیم به عهدهٔ `Content-Type`
            // پاسخِ سرور می‌افتد (همان کاری که `utils/favicon` هم می‌کند).
            icon.removeAttribute('type');
            icon.href = url.href;
            icon.dataset.tadbirFavicon = 'custom';
          }
        }
      } catch (_) { /* unavailable storage: keep a neutral icon until identity loads */ }
    </script>
